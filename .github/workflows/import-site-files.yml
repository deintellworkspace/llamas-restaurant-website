# One-time import, approved by the owner on 2026-10-13: brings the Llamas site
# files built on Higgsfield (code, dish images, flame video) into this
# repository under _import/, verifies the checksum, then removes itself.
name: Import site files
on:
  push:
    paths: [".github/workflows/import-site-files.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          curl -fsSL -o /tmp/site.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3J6ZjAwXyEcZcuzv78aiH49hqmI/100aa107-06d7-4087-bbe7-968d60f07da4.zip"
          echo "8fb8cb2a4db209ef53056b94a56a0ba1ce06899c45fe1f97593f202d1a628ca7  /tmp/site.zip" | sha256sum -c -
          mkdir -p _import && unzip -q /tmp/site.zip -d _import
          git rm -q .github/workflows/import-site-files.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Llamas site files from Higgsfield (sha256 8fb8cb2a)"
          git push
